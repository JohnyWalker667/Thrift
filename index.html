<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Семейная копилка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800 relative">

    <div class="max-w-2xl mx-auto pb-10">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Семейная копилка</h1>
        </header>

        <!-- Форма добавления цели -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6">
            <h2 class="text-lg font-bold mb-3 text-slate-800">Новая цель</h2>
            <form id="goalForm" class="space-y-3">
                <div>
                    <input type="text" id="goalTitle" required placeholder="Название (например: Отпуск)" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="targetAmount" required min="1" placeholder="Нужно (₽)" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <input type="number" id="currentAmount" required min="0" placeholder="Отложено (₽)" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Фотография</label>
                    <input type="file" id="imageFile" accept="image/*" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2.5 rounded-xl transition duration-150">
                    Добавить цель
                </button>
            </form>
        </section>

        <!-- Список целей -->
        <div id="goalsContainer" class="space-y-4"></div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="editModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-md">
            <h2 class="text-lg font-bold mb-4">Редактировать цель</h2>
            <input type="hidden" id="editGoalId">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Новое название</label>
                    <input type="text" id="editGoalTitle" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Заменить фото (оставьте пустым, если не нужно)</label>
                    <input type="file" id="editImageFile" accept="image/*" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-5">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-slate-600 font-semibold rounded-xl">Отмена</button>
                <button onclick="saveEdit()" id="
