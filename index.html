<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Копилка Целей</title>
    <!-- Скрипт для связи с Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">

    <h1 class="text-2xl font-bold mb-6 text-center">Мои финансовые цели</h1>

    <!-- Карточка цели -->
    <div class="bg-white rounded-2xl shadow-lg p-5 mb-4">
        <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=500&q=80" alt="MacBook" class="rounded-xl w-full h-40 object-cover mb-4">
        
        <h2 class="text-xl font-semibold mb-2">Новый MacBook Pro</h2>
        
        <div class="flex justify-between text-sm text-gray-500 mb-1">
            <span>Отложено: 150 000 ₽</span>
            <span>Цель: 250 000 ₽</span>
        </div>
        
        <!-- Прогресс-бар -->
        <div class="w-full bg-gray-200 rounded-full h-3 mb-4">
            <div class="bg-blue-500 h-3 rounded-full" style="width: 60%"></div>
        </div>

        <button onclick="addFunds()" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-xl active:bg-blue-600 transition">
            + Пополнить копилку
        </button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        function addFunds() {
            // Здесь будет логика добавления денег и отправки данных обратно в бота
            tg.showPopup({
                title: 'Пополнение',
                message: 'Функция добавления средств в разработке!',
                buttons: [{type: 'ok'}]
            });
        }
    </script>
</body>
</html>
