<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Семейная копилка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800 relative">

    <div class="max-w-2xl mx-auto pb-10">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Семейная копилка</h1>
        </header>

        <!-- Форма добавления цели -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6">
            <h2 class="text-lg font-bold mb-3 text-slate-800">Новая цель</h2>
            <form id="goalForm" class="space-y-3">
                <div>
                    <input type="text" id="goalTitle" required placeholder="Название (например: Отпуск)" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="targetAmount" required min="1" placeholder="Нужно (₽)" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <input type="number" id="currentAmount" required min="0" placeholder="Отложено (₽)" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Фотография</label>
                    <input type="file" id="imageFile" accept="image/*" 
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2.5 rounded-xl transition duration-150">
                    Добавить цель
                </button>
            </form>
        </section>

        <!-- Кнопка ручного присоединения -->
        <div class="mb-6 flex justify-center">
            <button id="joinByCodeBtn" class="text-sm font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-5 py-2.5 rounded-xl transition">
                🤝 Присоединиться к цели по коду
            </button>
        </div>

        <!-- Список целей -->
        <div id="goalsContainer" class="space-y-4"></div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="editModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-md">
            <h2 class="text-lg font-bold mb-4">Редактировать цель</h2>
            <input type="hidden" id="editGoalId">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Новое название</label>
                    <input type="text" id="editGoalTitle" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Заменить фото (оставьте пустым, если не нужно)</label>
                    <input type="file" id="editImageFile" accept="image/*" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-5">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-slate-600 font-semibold rounded-xl">Отмена</button>
                <button onclick="saveEdit()" id="saveEditBtn" class="px-4 py-2 bg-blue-500 text-white font-semibold rounded-xl">Сохранить</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, where, arrayUnion, getDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const tg = window.Telegram.WebApp;
        tg.expand();

        const tgUser = tg.initDataUnsafe?.user;
        const currentUserId = tgUser ? tgUser.id : 0; 
        const startParam = tg.initDataUnsafe?.start_param; 

        const firebaseConfig = {
            apiKey: "AIzaSyDg4YhG4x97r4SzW12nHlklui7vI5CgNpU",
            authDomain: "family-thrift.firebaseapp.com",
            projectId: "family-thrift",
            storageBucket: "family-thrift.firebasestorage.app",
            messagingSenderId: "271975083890",
            appId: "1:271975083890:web:14761fbdd3324a0a3877eb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const goalsCol = collection(db, 'goals');
        const myGoalsQuery = query(goalsCol, where("members", "array-contains", currentUserId));

        const form = document.getElementById('goalForm');
        const container = document.getElementById('goalsContainer');
        const submitBtn = document.getElementById('submitBtn');
        let currentGoals = [];

        // 1. АВТОМАТИЧЕСКОЕ ПРИСОЕДИНЕНИЕ (если ссылка сработала)
        async function checkInviteAndJoin() {
            if (currentUserId !== 0 && startParam && startParam.startsWith('goal_')) {
                const goalId = startParam.replace('goal_', '');
                try {
                    const goalRef = doc(db, 'goals', goalId);
                    const docSnap = await getDoc(goalRef);
                    if (docSnap.exists()) {
                        const goalData = docSnap.data();
                        if (!goalData.members.includes(currentUserId)) {
                            await updateDoc(goalRef, {
                                members: arrayUnion(currentUserId),
                                type: 'shared'
                            });
                            tg.showAlert('Вы успешно присоединились к общей цели!');
                        }
                    }
                } catch (e) {
                    tg.showAlert("Сетевая ошибка: " + e.message);
                }
            }
        }
        checkInviteAndJoin();

        // 2. РУЧНОЕ ПРИСОЕДИНЕНИЕ ПО КОДУ (резервный вариант)
        document.getElementById('joinByCodeBtn').addEventListener('click', async () => {
            const code = prompt('Введите код приглашения (например, 3xZfz74FJ...):');
            if (!code) return;
            
            // Очищаем код от лишнего мусора, если вставили всю ссылку
            let goalId = code.trim();
            if (goalId.includes('startapp=goal_')) {
                goalId = goalId.split('startapp=goal_')[1];
            } else if (goalId.startsWith('goal_')) {
                goalId = goalId.replace('goal_', '');
            }

            try {
                const goalRef = doc(db, 'goals', goalId);
                const docSnap = await getDoc(goalRef);
                
                if (docSnap.exists()) {
                    const goalData = docSnap.data();
                    if (!goalData.members.includes(currentUserId)) {
                        await updateDoc(goalRef, {
                            members: arrayUnion(currentUserId),
                            type: 'shared'
                        });
                        tg.showAlert('Готово! Вы присоединились к цели.');
                    } else {
                        tg.showAlert('Вы уже участвуете в этой цели!');
                    }
                } else {
                    tg.showAlert('Цель не найдена. Проверьте код.');
                }
            } catch (e) {
                tg.showAlert('Ошибка подключения: включите VPN и попробуйте снова. ' + e.message);
            }
        });

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);
            const IMGBB_API_KEY = '0d0d2b14dd00e8b1b2032d67aff9feae';

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) return data.data.url;
                return '';
            } catch (error) {
                return '';
            }
        }

        onSnapshot(myGoalsQuery, (snapshot) => {
            currentGoals = [];
            snapshot.forEach((doc) => {
                currentGoals.push({ ...doc.data(), id: doc.id });
            });
            renderGoals();
        });

        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU').format(amount) + ' ₽';
        }

        function renderGoals() {
            container.innerHTML = '';
            if (currentGoals.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Пока нет целей. Создайте первую!</div>`;
                return;
            }

            currentGoals.sort((a, b) => b.createdAt - a.createdAt).forEach(goal => {
                const percent = Math.min(100, Math.round((goal.current / goal.target) * 100));
                const defaultImg = 'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?auto=format&fit=crop&w=600&q=80';
                
                const typeBadge = goal.type === 'shared' 
                    ? `<span class="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold uppercase rounded-md absolute top-3 right-3 shadow-sm">Общая</span>`
                    : `<span class="px-2 py-1 bg-slate-800 text-white text-[10px] font-bold uppercase rounded-md absolute top-3 right-3 shadow-sm">Личная</span>`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative';
                card.innerHTML = `
                    <div class="h-32 w-full bg-slate-100 overflow-hidden relative">
                        <img src="${goal.image || defaultImg}" alt="${goal.title}" class="w-full h-full object-cover">
                        ${typeBadge}
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-lg font-bold text-slate-900 leading-tight">${goal.title}</h3>
                            <div class="flex gap-2 shrink-0 ml-2">
                                <button id="share-${goal.id}" class="text-indigo-500 hover:text-indigo-700 text-xs font-medium">Поделиться</button>
                                <button id="edit-${goal.id}" class="text-blue-500 hover:text-blue-700 text-xs font-medium">Ред.</button>
                                <button id="del-${goal.id}" class="text-red-400 hover:text-red-600 text-xs font-medium">Удалить</button>
                            </div>
                        </div>
                        
                        <div class="flex justify-between text-xs text-slate-500 mb-1">
                            <span>Накоплено: <strong class="text-slate-800">${formatMoney(goal.current)}</strong></span>
                            <span>Цель: <strong class="text-slate-800">${formatMoney(goal.target)}</strong></span>
                        </div>

                        <div class="w-full bg-slate-100 rounded-full h-2.5 mb-3 overflow-hidden">
                            <div class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                        </div>

                        <button id="add-${goal.id}" class="w-full py-2 bg-blue-50 active:bg-blue-100 text-blue-600 font-semibold text-sm rounded-xl transition">
                            + Пополнить
                        </button>
                    </div>
                `;
                container.appendChild(card);

                document.getElementById(`del-${goal.id}`).addEventListener('click', () => deleteGoal(goal.id));
                document.getElementById(`add-${goal.id}`).addEventListener('click', () => addFunds(goal.id, goal.current));
                document.getElementById(`edit-${goal.id}`).addEventListener('click', () => openEditModal(goal.id, goal.title));
                document.getElementById(`share-${goal.id}`).addEventListener('click', () => shareGoal(goal.id, goal.title));
            });
        }

        window.shareGoal = function(id, title) {
            const botUsername = 'MagoThriftBot';
            const shareUrl = `https://t.me/${botUsername}/app?startapp=goal_${id}`;
            // Добавили код текстом, чтобы его можно было легко скопировать
            const text = `Давай копить вместе на "${title}"!\n\nМоя ссылка: ${shareUrl}\n\nЕсли ссылка не открывает приложение сразу, открой Кубышку и нажми "Присоединиться по коду".\nТвой код: ${id}`;
            
            const telegramShareUrl = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(text)}`;
            tg.openTelegramLink(telegramShareUrl);
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (currentUserId === 0) {
                alert("Откройте приложение внутри Telegram!");
                return;
            }
            submitBtn.textContent = 'Загрузка...';
            submitBtn.disabled = true;

            const fileInput = document.getElementById('imageFile');
            let imageUrl = '';
            if (fileInput.files.length > 0) {
                imageUrl = await uploadImage(fileInput.files[0]);
            }

            const newGoal = {
                title: document.getElementById('goalTitle').value.trim(),
                target: Number(document.getElementById('targetAmount').value),
                current: Number(document.getElementById('currentAmount').value),
                image: imageUrl,
                createdAt: Date.now(),
                ownerId: currentUserId,
                type: "personal",
                members: [currentUserId]
            };
            
            await addDoc(goalsCol, newGoal);
            form.reset();
            submitBtn.textContent = 'Добавить цель';
            submitBtn.disabled = false;
        });

        window.addFunds = async function(id, currentAmount) {
            const amount = prompt('Сколько денег добавить? (₽)');
            const num = Number(amount);
            if (num && num > 0) {
                await updateDoc(doc(db, 'goals', id), { current: currentAmount + num });
            }
        };

        window.deleteGoal = async function(id) {
            if (confirm('Точно удалить эту цель?')) {
                await deleteDoc(doc(db, 'goals', id));
            }
        };

        window.openEditModal = function(id, currentTitle) {
            document.getElementById('editGoalId').value = id;
            document.getElementById('editGoalTitle').value = currentTitle;
            document.getElementById('editImageFile').value = '';
            document.getElementById('editModal').classList.remove('hidden');
        };

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.add('hidden');
        };

        window.saveEdit = async function() {
            const btn = document.getElementById('saveEditBtn');
            btn.textContent = 'Сохранение...';
            btn.disabled = true;

            const id = document.getElementById('editGoalId').value;
            const newTitle = document.getElementById('editGoalTitle').value.trim();
            const fileInput = document.getElementById('editImageFile');
            
            const updates = {};
            if (newTitle) updates.title = newTitle;
            if (fileInput.files.length > 0) {
                updates.image = await uploadImage(fileInput.files[0]);
            }

            await updateDoc(doc(db, 'goals', id), updates);
            closeEditModal();
            btn.textContent = 'Сохранить';
            btn.disabled = false;
        };
    </script>
</body>
</html>
